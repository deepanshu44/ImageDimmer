<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <style>
      body {
          padding: 0.5em;
      }
      input {
          vertical-align: middle;
      }
      fieldset{
	  border-radius: 5%;
      }
      label {
	  opacity: 0.7;
	  font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>Brightness level:</legend>
      0 <input width="100" type="range" min="0" max="1" value="1" step="0.1" id="image_dimmer_slider"> 1
      <br>
      <label for="image_dimmer_video_opt">Video:</label>
      <input id="image_dimmer_video_opt" name="image_dimmer_video_opt" type="checkbox"/>
      <label for="image_dimmer_svg_opt">SVG:</label>
      <input id="image_dimmer_svg_opt" name="image_dimmer_svg_opt" type="checkbox"/>
    </fieldset>
    <script src="/popup.js"></script>
  </body>
</html>
